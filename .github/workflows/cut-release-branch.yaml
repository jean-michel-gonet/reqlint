name: Cut Release Branch

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI / CLI

permissions:
  contents: write

jobs:
  cut-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Calculate Versions & Branch Name
        id: versioning
        run: |
          # 1. Extract current POM version (e.g., 1.0.0-SNAPSHOT)
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Current version is: $CURRENT_VERSION"

          # 2. Strip '-SNAPSHOT' -> 1.0.0
          CLEAN_VER="${CURRENT_VERSION%-SNAPSHOT}"

          # 3. Parse Major and Minor numbers
          MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)

          # 4. Calculate next minor version -> 1.1.0-SNAPSHOT
          NEXT_MINOR=$((MINOR + 1))
          NEXT_VERSION="${MAJOR}.${NEXT_MINOR}.0-SNAPSHOT"

          # 5. Define release branch name -> release-1.0
          RELEASE_BRANCH="release-${MAJOR}.${MINOR}"

          # Export variables for subsequent steps
          echo "RELEASE_BRANCH=$RELEASE_BRANCH" >> $GITHUB_ENV
          echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and Push Release Branch
        run: |
          # Create release branch from current HEAD (keeping 1.0.0-SNAPSHOT as-is)
          git checkout -b $RELEASE_BRANCH
          git push origin $RELEASE_BRANCH
          echo "Pushed new branch: $RELEASE_BRANCH"

      - name: Bump Minor Version on Main
        run: |
          # Return to original branch (main)
          git checkout ${{ github.ref_name }}

          # Bump POM versions to 1.1.0-SNAPSHOT
          mvn versions:set -DnewVersion=${{ env.NEXT_VERSION }} -DgenerateBackupPoms=false

          # Commit and push back to main
          git add "**/pom.xml" pom.xml
          git commit -m "chore: bump main version to ${{ env.NEXT_VERSION }} [skip ci]"
          git push origin ${{ github.ref_name }}